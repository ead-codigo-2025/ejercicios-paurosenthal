<body><main>
<header><h1>Caminar por Sotomayor</h1><p>Dos visualizaciones interactivas de 96 respuestas sobre el desplazamiento en Plaza Sotomayor.</p></header>
<nav aria-label="Elegir visualización">
<a class="btn" data-view="pistas" href="#pistas">Pistas horizontales</a>
<a class="btn" data-view="libre" href="#libre">Caminata libre</a>
</nav>
<div id="visualizacion"></div>
</main>
<template id="pistas">
<section id="sotomayor-caminantes">
  <div class="graph-view" data-graph>
  <h2>Formas de caminar por Sotomayor</h2>
  <div class="walking-layout" data-layout>
  <div class="comfort-key" data-comfort aria-label="Color por nivel de comodidad"></div>
  <div class="category-key" data-groups hidden aria-label="Subcategorías y cantidad de respuestas"></div>
  <div class="trace-stage" data-stage aria-label="Figuras de las 96 personas encuestadas">
    <div class="trace-dividers" data-dividers aria-hidden="true"></div>
  </div>
  </div>
  <div class="viz-row" role="group" aria-label="Agrupar las figuras">
    <button type="button" class="btn" data-field="0">Edades</button>
    <button type="button" class="btn" data-field="1">Ocupación</button>
    <button type="button" class="btn" data-field="6">Dificultades</button>
    <button type="button" class="btn" data-field="3">Transporte</button>
    <button type="button" class="btn btn-ghost" data-pause>Pausar movimiento</button>
  </div>
  <p class="text-small text-muted" data-status aria-live="polite"></p>
  </div>
  <section data-detail hidden aria-labelledby="sotomayor-detail-title">
    <button type="button" class="btn" data-back>Volver al gráfico</button>
    <div class="detail-body">
    <h3 id="sotomayor-detail-title" data-detail-title></h3>
    <dl data-answers></dl>
    </div>
  </section>
</section>
<style>

  #sotomayor-caminantes .trace-dividers span + span {border-block-start:1px solid var(--border)}

<script>
(() => {
  const mount = document.getElementById('visualizacion');
  const links = [...document.querySelectorAll('[data-view]')];
  const frames = new Map();
  function render() {
    const view = location.hash === '#libre' ? 'libre' : 'pistas';
    for (const link of links) {
      if (link.dataset.view === view) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    }
    for (const [key, wrapper] of frames) wrapper.hidden = key !== view;
    if (frames.has(view)) return;
    const wrapper = document.createElement('div');
    wrapper.append(document.getElementById(view).content.cloneNode(true));
    const fragmentScript = wrapper.querySelector('script');
    const script = document.createElement('script');
    script.textContent = fragmentScript.textContent;
    fragmentScript.remove();
    mount.append(wrapper);
    frames.set(view, wrapper);
    wrapper.append(script);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
